plugins {
	id 'java-library'
	id 'java-test-fixtures'
	id 'com.diffplug.spotless' version "${spotless_version}"
}

group = rootProject.maven_group
version = rootProject.mod_version

repositories {
	mavenCentral()
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = 'UTF-8'
}

dependencies {
	api 'com.google.code.gson:gson:2.14.0'
	api 'org.slf4j:slf4j-api:2.0.17'

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.+"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('verifyEngineClasspath') {
	group = 'verification'
	description = 'Rejects Minecraft, Fabric, optional UI and native audio artifacts from the engine classpath.'
	inputs.files(configurations.compileClasspath, configurations.runtimeClasspath)

	doLast { task ->
		def forbiddenArtifactName = ~/(?i)(?:^|[-_.])(minecraft|fabric|yacl|modmenu|whisper|sherpa)(?:[-_.]|$)/
		def forbiddenClassPrefixes = [
				'net/minecraft/',
				'net/fabricmc/',
				'dev/isxander/yacl3/',
				'com/terraformersmc/modmenu/',
				'io/github/givimad/whisperjni/',
				'com/k2fsa/sherpa/onnx/'
		]
		def violations = []
		task.inputs.files.files.each { dependency ->
			if (forbiddenArtifactName.matcher(dependency.name).find()) {
				violations.add(dependency.name)
			}
			if (dependency.isDirectory()) {
				java.nio.file.Files.walk(dependency.toPath()).withCloseable { paths ->
					paths.filter { java.nio.file.Files.isRegularFile(it) }.forEach { path ->
						def className = dependency.toPath().relativize(path).toString().replace('\\', '/')
						if (forbiddenClassPrefixes.any { className.startsWith(it) }) {
							violations.add("${dependency.name}!/${className}")
						}
					}
				}
			} else if (dependency.name.endsWith('.jar')) {
				new java.util.zip.ZipFile(dependency).withCloseable { archive ->
					archive.entries().each { entry ->
						if (forbiddenClassPrefixes.any { entry.name.startsWith(it) }) {
							violations.add("${dependency.name}!/${entry.name}")
						}
					}
				}
			}
		}
		if (!violations.isEmpty()) {
			throw new GradleException("Forbidden dependencies on the engine classpath: ${violations.unique().sort()}")
		}
		logger.lifecycle('Engine compile and runtime classpaths contain no game, optional UI or native audio dependencies.')
	}
}

test {
	useJUnitPlatform()
	// Lets PromptGoldenTest regenerate its golden files with -Dfriendai.golden.write=true.
	def goldenWrite = System.getProperty("friendai.golden.write")
	if (goldenWrite != null) {
		systemProperty "friendai.golden.write", goldenWrite
	}
}

// One command that rewrites every prompt golden from the current PromptBuilder output. The test writes into
// src/test/resources/prompt-golden, so the working directory must stay this project. A prompt change and its golden
// update land in the same commit; a golden-only diff is reviewed as a diff of the system prompt.
tasks.register('updatePromptGolden', Test) {
	group = 'verification'
	description = 'Rewrites src/test/resources/prompt-golden from the current system prompt; review the diff.'
	dependsOn testClasses
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter {
		includeTestsMatching 'dev.friendai.agent.turn.PromptGoldenTest'
	}
	systemProperty 'friendai.golden.write', 'true'
	outputs.upToDateWhen { false }
}

spotless {
	java {
		def selected = providers.gradleProperty('spotlessFiles')
				.map {
					it.split(',')*.trim()
							.collect { path -> path.replace('\\', '/') }
							.findAll { path -> path.startsWith('engine/') }
							.collect { path -> path.substring('engine/'.length()) }
				}
				.getOrElse(null)
		if (selected != null) {
			if (selected.isEmpty()) {
				target fileTree(layout.buildDirectory.dir('spotless-empty-selection'))
			} else {
				target selected
			}
		} else {
			target 'src/**/*.java'
		}
		palantirJavaFormat(rootProject.palantir_java_format_version)
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
		lineEndings(com.diffplug.spotless.LineEnding.UNIX)
	}
}
