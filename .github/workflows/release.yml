name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check the tag matches mod_version
        run: |
          version="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version=${version} in gradle.properties"
            exit 1
          fi
      - name: Build, test and run GameTests
        run: ./gradlew build --console=plain
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            "build/libs/friedai-${GITHUB_REF_NAME#v}.jar" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${prerelease}
