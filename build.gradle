plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.diffplug.spotless' version "${spotless_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = 'https://maven.isxander.dev/releases' }
	maven { url = 'https://maven.terraformersmc.com/releases' }
	maven { url = 'https://jitpack.io' }
	mavenCentral()
}

configurations {
	sherpaNatives
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"friendai" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "friendai-gametest"
		eula = true
	}
}

// Forwards `-Dfabric-api.gametest.filter=<glob>` (for example `friendai-gametest:build_tests_*`) from the Gradle
// command line to the GameTest server; without this the property stays in the Gradle JVM and the whole suite runs.
tasks.named('runGameTest') {
	def gameTestFilter = providers.systemProperty("fabric-api.gametest.filter")
	if (gameTestFilter.isPresent()) {
		systemProperty "fabric-api.gametest.filter", gameTestFilter.get()
	}
	// Mock players have no client to negotiate the Friendai protocol with; see ServerProtocolConnections.join.
	systemProperty "friendai.gametest.tolerateUnnegotiatedPeers", "true"
}

// CI runs the GameTest suite as a matrix of shards, each booting its own server, and every registered class must be in
// exactly one shard so a new test cannot silently stop running. The map lives in one file; this task checks it and
// writes the `strategy.matrix` body the workflow reads.
tasks.register('verifyGametestShards') {
	group = 'verification'
	description = 'Checks that every registered GameTest class is in exactly one CI shard and writes the matrix file.'
	def shardFile = file('.github/gametest-shards.json')
	def modFile = file('src/gametest/resources/fabric.mod.json')
	def matrixFile = new File(layout.buildDirectory.get().asFile, 'gametest-shard-matrix.json')
	inputs.file(shardFile)
	inputs.file(modFile)
	outputs.file(matrixFile)

	doLast { task ->
		def slurper = new groovy.json.JsonSlurper()
		def shards = slurper.parse(shardFile).shards
		def registered = slurper.parse(modFile).entrypoints['fabric-gametest']
				.collect { it.tokenize('.').last() } as Set
		def owner = [:]
		def problems = []
		shards.each { shard ->
			if (!(shard.name ==~ /[a-z0-9-]+/)) {
				problems << "shard '${shard.name}' needs a lowercase name of letters, digits and dashes"
			}
			if (!shard.classes) {
				problems << "shard '${shard.name}' has no classes"
			}
			shard.classes.each { name ->
				if (!registered.contains(name)) {
					problems << "shard '${shard.name}' lists '$name', which is not a fabric-gametest entrypoint"
				}
				if (owner.containsKey(name)) {
					problems << "'$name' is in both '${owner[name]}' and '${shard.name}'"
				}
				owner[name] = shard.name
			}
		}
		(registered - owner.keySet()).sort().each { problems << "'$it' is registered but in no shard" }
		if (!problems.isEmpty()) {
			throw new GradleException("GameTest shard map is invalid:\n  " + problems.join('\n  '))
		}
		// The workflow runs scripts/run-gametest-shard.sh, which reads the same file and boots one class at a time;
		// the matrix only carries the shard names.
		def matrix = [include: shards.collect { shard -> [name: shard.name] }]
		matrixFile.parentFile.mkdirs()
		matrixFile.text = groovy.json.JsonOutput.toJson(matrix)
		task.logger.lifecycle("GameTest shards: "
				+ shards.collect { "${it.name} (${it.classes.size()} classes)" }.join(', '))
	}
}

dependencies {
	implementation project(':engine')
	include project(':engine')

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional integrations: the mod works without them.
	compileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	localRuntime "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Local speech-to-text.
	implementation "io.github.givimad:whisper-jni:${project.whisper_jni_version}"
	include "io.github.givimad:whisper-jni:${project.whisper_jni_version}"

	// Local text-to-speech: the JVM bindings ship as a jar, the natives are unpacked into our resources.
	implementation "com.github.k2-fsa.sherpa-onnx:sherpa-onnx-jvm:${project.sherpa_onnx_version}"
	include "com.github.k2-fsa.sherpa-onnx:sherpa-onnx-jvm:${project.sherpa_onnx_version}"
	implementation "org.apache.commons:commons-compress:${project.commons_compress_version}"
	include "org.apache.commons:commons-compress:${project.commons_compress_version}"
	// commons-compress reads tar entry names and timestamps through these two. The development classpath
	// gets them transitively, but only what is included here ships, and a voice download extracts a tar.
	implementation "commons-io:commons-io:${project.commons_io_version}"
	include "commons-io:commons-io:${project.commons_io_version}"
	implementation "org.apache.commons:commons-lang3:${project.commons_lang3_version}"
	include "org.apache.commons:commons-lang3:${project.commons_lang3_version}"

	sherpaNatives "com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-win-x64:${project.sherpa_onnx_version}"
	sherpaNatives "com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-linux-x64:${project.sherpa_onnx_version}"
	sherpaNatives "com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-osx-x64:${project.sherpa_onnx_version}"
	sherpaNatives "com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-osx-aarch64:${project.sherpa_onnx_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.+"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "com.google.code.gson:gson:2.15.0"
	testImplementation(testFixtures(project(':engine')))
	testImplementation sourceSets.client.output
	gametestImplementation sourceSets.client.output
	gametestImplementation(testFixtures(project(':engine')))
}

test {
	dependsOn ':engine:test'
	useJUnitPlatform()
	// Lets the gated local-TTS spike opt in with -Dfriendai.tts.voice=<installed voice dir>.
	def ttsVoice = System.getProperty("friendai.tts.voice")
	if (ttsVoice != null) {
		systemProperty "friendai.tts.voice", ttsVoice
	}
	// Lets PromptGoldenTest regenerate its golden files with -Dfriendai.golden.write=true.
	def goldenWrite = System.getProperty("friendai.golden.write")
	if (goldenWrite != null) {
		systemProperty "friendai.golden.write", goldenWrite
	}
	// Opt-in live evaluation: -Dfriendai.live=true -Dfriendai.live.config=<server config path>.
	["friendai.live", "friendai.live.config"].each { key ->
		def value = System.getProperty(key)
		if (value != null) {
			systemProperty key, value
		}
	}
}

// `./gradlew updatePromptGolden` works from the repository root; the work itself runs in the engine project, where
// the golden files and the test live.
tasks.register('updatePromptGolden') {
	group = 'verification'
	description = 'Rewrites the engine prompt goldens from the current system prompt; review the diff before committing.'
	dependsOn ':engine:updatePromptGolden'
}

def requestedTaskNames = gradle.startParameter.taskNames
def rootTestRequested = requestedTaskNames.any { it == 'test' || it == ':test' }
def engineTestRequested = requestedTaskNames.any { it == ':engine:test' }
def rootTestFiltered = requestedTaskNames.any { it == '--tests' || it.startsWith('--tests=') }

project(':engine').plugins.withId('java') {
	project(':engine').tasks.named('test').configure { engineTask ->
		engineTask.onlyIf('Skip engine tests for a filtered root-only test invocation') { task ->
			if (rootTestRequested && !engineTestRequested && rootTestFiltered) {
				task.logger.lifecycle(
						'Skipping :engine:test for a filtered root test run; invoke :engine:test directly to select engine tests.')
				return false
			}
			true
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	from({ configurations.sherpaNatives.collect { zipTree(it) } }) {
		include "sherpa-onnx/native/**"
	}

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

tasks.named('test') {
	dependsOn tasks.named('compileClientJava')
	systemProperty 'friendai.architecture.classpath', [
			file('build/classes/java/main'),
			file('build/classes/java/client'),
			file('engine/build/classes/java/main')
	].collect { it.absolutePath }.join(File.pathSeparator)
}

// One Java style for the whole tree. `./gradlew spotlessApply` rewrites the sources, `spotlessCheck` (part of
// `check`) fails on a file that was edited by hand in another style. Palantir's formatter is the one that matches
// this repository: 4-space indent and 120-column lines, where google-java-format re-indents everything to 2 spaces.
// `-PspotlessFiles=a/Foo.java,b/Bar.java` restricts both tasks to those files: several sessions share this checkout
// and an agent must format its own work without rewriting another session's uncommitted files.
spotless {
	java {
		def selected = providers.gradleProperty('spotlessFiles')
				.map {
					it.split(',')*.trim()
							.findAll { path -> !path.isEmpty() }
							.collect { path -> path.replace('\\', '/') }
							.findAll { path -> !path.startsWith('engine/') }
				}
				.getOrElse(null)
		if (selected != null) {
			if (selected.isEmpty()) {
				target fileTree(layout.buildDirectory.dir('spotless-empty-selection'))
			} else {
				target selected
			}
		} else {
			target 'src/*/java/**/*.java'
		}
		palantirJavaFormat(project.palantir_java_format_version)
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
		// The repository stores Java as LF (`* text=auto` in .gitattributes); the formatter must produce the same
		// bytes on every OS, or a Windows run and a Linux CI run disagree about the same file.
		lineEndings(com.diffplug.spotless.LineEnding.UNIX)
	}
}

tasks.named('spotlessApply') {
	dependsOn ':engine:spotlessApply'
}

tasks.named('spotlessCheck') {
	dependsOn ':engine:spotlessCheck'
}

tasks.named('check') {
	dependsOn 'spotlessCheck'
}

tasks.register('verifyModArtifact') {
	group = 'verification'
	description = 'Verifies that the exported mod jar embeds the engine exactly once without test fixtures.'

	def modJar = tasks.named('jar')
	def engineJar = project(':engine').tasks.named('jar')
	def engineFixturesJar = project(':engine').tasks.named('testFixturesJar')
	def modJarArtifact = modJar.flatMap { it.archiveFile }
	def engineJarArtifact = engineJar.flatMap { it.archiveFile }
	def engineFixturesArtifact = engineFixturesJar.flatMap { it.archiveFile }
	def engineMainClasses = project(':engine').sourceSets.main.output.classesDirs
	def productionRuntime = sourceSets.main.runtimeClasspath
	def engineSkillIndex = project(':engine').file('src/main/resources/assets/friendai/skills/index.json')

	dependsOn modJar, engineJar, engineFixturesJar, ':engine:verifyEngineClasspath'
	inputs.file(modJarArtifact)
	inputs.file(engineJarArtifact)
	inputs.file(engineFixturesArtifact)
	inputs.file(engineSkillIndex)
	inputs.files(engineMainClasses)
	inputs.files(productionRuntime)

	doLast {
		def artifact = modJarArtifact.get().asFile
		def requiredEngineClasses = [
				'dev/friendai/foundation/text/UserMessage.class',
				'dev/friendai/foundation/text/UserFacingException.class',
				'dev/friendai/foundation/text/LanguageDetector.class',
				'dev/friendai/foundation/text/LanguageMemory.class',
				'dev/friendai/foundation/limits/RateLimiter.class',
				'dev/friendai/execution/queue/JobQueue.class',
				'dev/friendai/execution/tool/ToolRegistry.class',
				'dev/friendai/agent/turn/CompanionBrain.class',
				'dev/friendai/agent/llm/protocol/OpenAiChatProtocol.class'
		] as Set
		def requiredEngineResources = ['agent/intents_en.json', 'agent/intents_ru.json', 'assets/friendai/skills/index.json'] as Set
		def skillIndex = new groovy.json.JsonSlurper().parse(engineSkillIndex)
		if (!(skillIndex instanceof List)) {
			throw new GradleException("Engine skill index must be a JSON array: ${engineSkillIndex}")
		}
		if (skillIndex.isEmpty() || skillIndex.size() > 64) {
			throw new GradleException("Engine skill index must contain 1 to 64 entries: ${engineSkillIndex}")
		}
		def skillIds = [] as Set
		skillIndex.each { skill ->
			def id = skill instanceof Map ? skill.id : null
			if (!(id instanceof String) || !(id ==~ /[a-z-]{1,40}/) || !skillIds.add(id)) {
				throw new GradleException("Engine skill index contains an invalid or duplicate id: ${id}")
			}
			requiredEngineResources.add("assets/friendai/skills/${id}.txt")
		}
		def engineCopies = []
		def engineClassEntries = [] as Set
		def engineResourceEntries = [] as Set

		new java.util.zip.ZipFile(artifact).withCloseable { modArchive ->
			def metadataEntry = modArchive.getEntry('fabric.mod.json')
			if (metadataEntry == null) {
				throw new GradleException("Mod artifact is missing fabric.mod.json: ${artifact}")
			}
			def metadata
			modArchive.getInputStream(metadataEntry).withCloseable { stream ->
				metadata = new groovy.json.JsonSlurper().parse(stream)
			}
			def nestedPaths = (metadata.jars ?: []).collect { it.file }.findAll { it instanceof String }
			nestedPaths.each { nestedPath ->
				def nestedEntry = modArchive.getEntry(nestedPath)
				if (nestedEntry == null) {
					throw new GradleException("Nested jar metadata points to a missing entry: ${nestedPath}")
				}
				def foundClasses = [] as Set
				def foundResources = [] as Set
				new java.util.jar.JarInputStream(modArchive.getInputStream(nestedEntry)).withCloseable { nested ->
					java.util.jar.JarEntry entry
					while ((entry = nested.nextJarEntry) != null) {
						if (!entry.isDirectory()) {
							if (entry.name.endsWith('.class')) {
								foundClasses.add(entry.name)
							} else {
								foundResources.add(entry.name)
							}
						}
					}
				}
				if (!requiredEngineClasses.intersect(foundClasses).isEmpty()) {
					engineCopies.add(nestedPath)
					engineClassEntries = foundClasses
					engineResourceEntries = foundResources
				}
			}
			if (engineCopies.size() != 1) {
				throw new GradleException("Expected one nested engine jar, found ${engineCopies.size()} in ${artifact}")
			}
			def duplicateClasses = engineClassEntries.findAll { modArchive.getEntry(it) != null }
			if (!duplicateClasses.isEmpty()) {
				throw new GradleException("Engine classes are duplicated in the outer mod jar: ${duplicateClasses}")
			}
			def missingEngineResources = requiredEngineResources - engineResourceEntries
			if (!missingEngineResources.isEmpty()) {
				throw new GradleException("Engine artifact is missing required resources: ${missingEngineResources}")
			}
		}

		def missingEngineClasses = []
		engineMainClasses.files.each { classesDir ->
			if (classesDir.exists()) {
				classesDir.eachFileRecurse { file ->
					if (file.isFile() && file.name.endsWith('.class')) {
						def className = classesDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
						if (!engineClassEntries.contains(className)) {
							missingEngineClasses.add(className)
						}
					}
				}
			}
		}
		if (!missingEngineClasses.isEmpty()) {
			throw new GradleException("Engine artifact is missing compiled classes: ${missingEngineClasses}")
		}

		def fixtureClasses = [] as Set
		new java.util.zip.ZipFile(engineFixturesArtifact.get().asFile).withCloseable { fixtures ->
			fixtures.entries().each { entry ->
				if (!entry.isDirectory() && entry.name.endsWith('.class')) {
					fixtureClasses.add(entry.name)
				}
			}
		}
		def leakedFixtureClasses = fixtureClasses.intersect(engineClassEntries)
		if (!leakedFixtureClasses.isEmpty()) {
			throw new GradleException("Test fixture classes leaked into the engine artifact: ${leakedFixtureClasses}")
		}

		def runtimeUrls = productionRuntime.files.collect { it.toURI().toURL() } as URL[]
		new java.net.URLClassLoader(runtimeUrls, null).withCloseable { resourceLoader ->
			requiredEngineResources.each { resource ->
				if (resourceLoader.getResource(resource) == null) {
					throw new GradleException("Production resource lookup failed for ${resource}")
				}
			}
		}
	}
}

// Copies the freshly built mod jar to /test-builds/ (git-ignored) so it can be dropped into a
// Minecraft instance without digging through build/libs. Runs after every `assemble`/`build`.
tasks.register('exportTestJar', Sync) {
	group = 'build'
	description = 'Copies the mod jar to test-builds/ for quick manual testing.'
	from(tasks.named('jar'))
	into(layout.projectDirectory.dir('test-builds'))
}

tasks.named('assemble') {
	finalizedBy 'exportTestJar'
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
