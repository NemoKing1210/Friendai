plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = 'https://maven.isxander.dev/releases' }
	maven { url = 'https://maven.terraformersmc.com/releases' }
	maven { url = 'https://jitpack.io' }
	mavenCentral()
}

configurations {
	sherpaNatives
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"friendai" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "friendai-gametest"
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional integrations: the mod works without them.
	compileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	localRuntime "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Local speech-to-text.
	implementation "io.github.givimad:whisper-jni:${project.whisper_jni_version}"
	include "io.github.givimad:whisper-jni:${project.whisper_jni_version}"

	// Local text-to-speech: the JVM bindings ship as a jar, the natives are unpacked into our resources.
	implementation "com.github.k2-fsa.sherpa-onnx:sherpa-onnx-jvm:${project.sherpa_onnx_version}"
	include "com.github.k2-fsa.sherpa-onnx:sherpa-onnx-jvm:${project.sherpa_onnx_version}"
	implementation "org.apache.commons:commons-compress:${project.commons_compress_version}"
	include "org.apache.commons:commons-compress:${project.commons_compress_version}"

	sherpaNatives "com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-win-x64:${project.sherpa_onnx_version}"
	sherpaNatives "com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-linux-x64:${project.sherpa_onnx_version}"
	sherpaNatives "com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-osx-x64:${project.sherpa_onnx_version}"
	sherpaNatives "com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-osx-aarch64:${project.sherpa_onnx_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.+"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "com.google.code.gson:gson:2.11.0"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	from({ configurations.sherpaNatives.collect { zipTree(it) } }) {
		include "sherpa-onnx/native/**"
	}

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// Copies the freshly built mod jar to /test-builds/ (git-ignored) so it can be dropped into a
// Minecraft instance without digging through build/libs. Runs after every `assemble`/`build`.
tasks.register('exportTestJar', Sync) {
	group = 'build'
	description = 'Copies the mod jar to test-builds/ for quick manual testing.'
	from(tasks.named('jar'))
	into(layout.projectDirectory.dir('test-builds'))
}

tasks.named('assemble') {
	finalizedBy 'exportTestJar'
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
