name: Nightly

# The sharded CI job proves a failure is reproducible in its shard; this run proves the whole suite still passes in one
# server, where the tests share a world and a batch. It is the only place the full suite runs, so a flake that only
# appears across shards shows up within a day instead of at a release.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  full-game-tests:
    name: Full GameTest suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Run the whole suite in one server
        run: |
          set -o pipefail
          ./gradlew runGameTest --console=plain --stacktrace 2>&1 | tee gametest-console.log
      - name: Summarize
        if: always()
        run: |
          {
            echo "### Full GameTest suite"
            echo
            echo '```'
            grep -E 'GAME TESTS COMPLETE|required tests (passed|failed)|All [0-9]+ required tests passed' gametest-console.log || true
            grep -E ' failed at ' gametest-console.log | sed -E 's/^.*(friendai-gametest:[^!]+)!.*/\1/' | sort -u || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-gametest-logs
          path: |
            gametest-console.log
            build/run/
            run/logs/
          if-no-files-found: ignore
          retention-days: 14
